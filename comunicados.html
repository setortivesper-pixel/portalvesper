<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comunicados | Portal Vesper</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar" aria-label="Navegação principal"></aside>

  <main class="conteudo">
    <header class="topo">
      <label class="visually-hidden" for="pesquisa-comunicados">Pesquisar comunicados</label>
      <input id="pesquisa-comunicados" type="search" placeholder="Pesquisar comunicados..." disabled>

      <div class="usuario"><i class="fa-solid fa-user" aria-hidden="true"></i> Cauan</div>
    </header>

    <section class="titulo-pagina">
      <h1><i class="fa-solid fa-bullhorn" aria-hidden="true"></i> Comunicados</h1>
      <p>Fique por dentro dos avisos internos da empresa.</p>
    </section>

    <section class="lista-comunicados" aria-label="Lista de comunicados">
      <article class="comunicado">
        <span class="comunicado-icone"><i class="fa-solid fa-circle-info" aria-hidden="true"></i></span>
        <div>
          <time datetime="2026-07-31">31/07/2026</time>
          <h2>Central de comunicados</h2>
          <p>Os comunicados internos serão publicados nesta página.</p>
        </div>
      </article>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
