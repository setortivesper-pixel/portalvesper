<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="js/head.js"></script>
  <link rel="icon" type="image/png" href="img/faviconvesper.png">
</head>
<body>
  <aside class="sidebar" aria-label="Navegação principal"></aside>

  <main class="conteudo">
    <header class="topo">
      <label class="visually-hidden" for="pesquisa-geral">Pesquisar no portal</label>
      <div class="campo-pesquisa-geral">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="pesquisa-geral" type="search" placeholder="Pesquisar manuais e downloads..." autocomplete="off">
        <kbd>Esc</kbd>
      </div>


    </header>

    <section id="resultados-pesquisa" class="resultados-pesquisa" aria-live="polite" hidden>
      <header class="cabecalho-resultados">
        <p id="resumo-pesquisa"></p>
        <button id="limpar-pesquisa" type="button">Limpar busca</button>
      </header>
      <div id="lista-resultados" class="lista-resultados"></div>
    </section>

    <section class="banner">
      <h1>Bom dia! <span aria-hidden="true">👋</span></h1>
      <p>Bem-vindo ao Portal Interno Vesper.</p>
    </section>

    <section class="cards" aria-label="Acessos rápidos">
      <a class="card" href="https://docs.google.com/forms/d/e/1FAIpQLSf6FDbbCepjjwuYp5Xspb2bBjO5a2hNAEAKkRcPxEtlUfdWHg/viewform" target="_blank" rel="noopener">
        <span class="icone-card"><i class="fa-solid fa-headset" aria-hidden="true"></i></span>
        <h2>Abrir chamado</h2>
        <p>Solicite atendimento da equipe de TI.</p>
        <span class="botao">Abrir</span>
      </a>
      <a class="card" href="manuais.html">
        <span class="icone-card"><i class="fa-solid fa-book" aria-hidden="true"></i></span>
        <h2>Manuais</h2>
        <p>Consulte os procedimentos internos.</p>
        <span class="botao">Acessar</span>
      </a>
      <a class="card" href="downloads.html">
        <span class="icone-card"><i class="fa-solid fa-download" aria-hidden="true"></i></span>
        <h2>Downloads</h2>
        <p>Programas e links oficiais.</p>
        <span class="botao">Abrir</span>
      </a>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
