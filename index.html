<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Início | Portal Vesper</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/faviconvesper.png">
</head>
<body>
  <aside class="sidebar" aria-label="Navegação principal"></aside>

  <main class="conteudo">
    <header class="topo">
      <label class="visually-hidden" for="pesquisa-geral">Pesquisar no portal</label>
      <div class="campo-pesquisa-geral">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="pesquisa-geral" type="search" placeholder="Pesquisar manuais e downloads..." autocomplete="off">
      </div>
      <button class="botao-admin" type="button" data-admin-open>
        <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
        Admin
      </button>
    </header>

    <section id="resultados-pesquisa" class="resultados-pesquisa" aria-live="polite" hidden>
      <header class="cabecalho-resultados">
        <p id="resumo-pesquisa"></p>
        <button id="limpar-pesquisa" type="button">Limpar busca</button>
      </header>
      <div id="lista-resultados" class="lista-resultados"></div>
    </section>

    <section class="banner">
      <h1>Bom dia! <span aria-hidden="true">👋</span></h1>
      <p>Bem-vindo ao Portal Interno Vesper.</p>
    </section>

    <section class="cards" aria-label="Acessos rápidos">
      <a class="card" href="https://docs.google.com/forms/d/e/1FAIpQLSf6FDbbCepjjwuYp5Xspb2bBjO5a2hNAEAKkRcPxEtlUfdWHg/viewform" target="_blank" rel="noopener">
        <span class="icone-card"><i class="fa-solid fa-headset" aria-hidden="true"></i></span>
        <h2>Abrir chamado</h2>
        <p>Solicite atendimento da equipe de TI.</p>
        <span class="botao">Abrir</span>
      </a>
      <a class="card" href="manuais.html">
        <span class="icone-card"><i class="fa-solid fa-book" aria-hidden="true"></i></span>
        <h2>Manuais</h2>
        <p>Consulte os procedimentos internos.</p>
        <span class="botao">Acessar</span>
      </a>
      <a class="card" href="downloads.html">
        <span class="icone-card"><i class="fa-solid fa-download" aria-hidden="true"></i></span>
        <h2>Downloads</h2>
        <p>Programas e links oficiais.</p>
        <span class="botao">Abrir</span>
      </a>
    </section>
  </main>

  <div class="modal-admin" id="modal-admin" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="titulo-admin">
    <div class="modal-admin__backdrop" data-admin-close></div>
    <section class="modal-admin__card">
      <button class="modal-admin__fechar" type="button" aria-label="Fechar área administrativa" data-admin-close>
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
      <img class="modal-admin__logo" src="img/GVSPLogo.png" alt="Vesper Transportes">
      <h2 id="titulo-admin">Área Administrativa</h2>
      <p class="modal-admin__texto">Entre com suas credenciais para continuar</p>

      <form class="form-admin" id="form-admin">
        <div class="form-admin__grupo">
          <label for="admin-login">Login</label>
          <span class="form-admin__campo">
            <i class="fa-regular fa-user" aria-hidden="true"></i>
            <input id="admin-login" name="login" type="text" placeholder="Digite seu login" autocomplete="username" required>
          </span>
        </div>
        <div class="form-admin__grupo">
          <label for="admin-senha">Senha</label>
          <span class="form-admin__campo">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
            <input id="admin-senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            <button class="form-admin__senha" type="button" aria-label="Mostrar senha" data-toggle-password>
              <i class="fa-regular fa-eye" aria-hidden="true"></i>
            </button>
          </span>
        </div>
        <button class="form-admin__entrar" type="submit">Entrar</button>
        <button class="form-admin__cancelar" type="button" data-admin-close>Cancelar</button>
      </form>
    </section>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
