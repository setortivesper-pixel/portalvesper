<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel Administrativo | Portal Vesper</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
  <style>
    .crud-form{display:grid;gap:15px;text-align:left}.crud-form label{display:grid;gap:7px;color:#334155;font-size:13px;font-weight:bold}.crud-form input{height:46px;padding:0 12px;border:1px solid #cfe0ff;border-radius:10px;color:#1e293b;background:#fff;font:inherit}.crud-form input:focus{border-color:#2563eb;outline:0;box-shadow:0 0 0 3px rgb(37 99 235 / 12%)}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:7px}.secondary-button{padding:12px 16px;border:1px solid #cbd5e1;border-radius:10px;color:#475569;background:#fff;cursor:pointer;font:inherit;font-weight:bold}.file-upload{position:relative;display:flex;align-items:center;gap:12px;min-height:64px;padding:11px 13px;border:1px dashed #9fc1ff;border-radius:11px;color:#2563eb;background:#f8fbff;cursor:pointer;transition:.2s}.file-upload:hover{border-color:#2563eb;background:#eff6ff}.file-upload:has(input:focus){border-color:#2563eb;box-shadow:0 0 0 3px rgb(37 99 235 / 12%)}.file-upload input{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;opacity:0;cursor:pointer}.file-upload>i{display:grid;width:34px;height:34px;flex:none;place-items:center;border-radius:9px;background:#e0ecff}.file-upload span{display:grid;gap:3px;min-width:0}.file-upload strong{font-size:13px}.file-upload em{overflow:hidden;color:#64748b;font-size:11px;font-style:normal;font-weight:normal;text-overflow:ellipsis;white-space:nowrap}
  </style>
  <link rel="icon" type="image/png" href="../img/faviconvesper.png">
</head>
<body>
  <aside class="admin-sidebar" id="admin-sidebar" aria-label="Navegação administrativa">
    <a class="admin-brand" href="../index.html" aria-label="Voltar ao Portal Vesper"><img src="../img/GVSPLogo.png" alt="Vesper Transportes"></a>
    <p class="admin-sidebar__label">ADMINISTRAÇÃO</p>
    <nav class="admin-nav" id="admin-nav"></nav>
    <footer class="admin-sidebar__footer"><strong>Portal Vesper</strong><span>Versão 1.0.0</span></footer>
  </aside>
  <div class="admin-backdrop" id="admin-backdrop"></div>
  <main class="admin-main">
    <header class="admin-header">
      <button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-label="Abrir menu"><i class="fa-solid fa-bars"></i></button>
      <div><p class="eyebrow">PAINEL ADMINISTRATIVO</p><h1 id="page-title">Dashboard</h1></div>
      <div class="admin-profile"><span class="admin-avatar">A</span><div><strong>Administrador</strong><small>Acesso simulado</small></div></div>
    </header>
    <section id="admin-content" class="admin-content" aria-live="polite"></section>
  </main>
  <div class="admin-modal" id="admin-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="admin-modal__backdrop" data-modal-close></div>
    <section class="admin-modal__card"><button class="admin-modal__close" type="button" aria-label="Fechar" data-modal-close><i class="fa-solid fa-xmark"></i></button><span class="admin-modal__icon"><i class="fa-solid fa-pen-to-square"></i></span><h2 id="modal-title">Adicionar item</h2><p id="modal-text">Preencha os dados abaixo.</p><div id="modal-body"></div></section>
  </div>
  <script src="admin.js"></script>
</body>
</html>
