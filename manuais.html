<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manuais | Portal Vesper</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/faviconvesper.png">
</head>
<body>
  <aside class="sidebar" aria-label="Navegação principal"></aside>

  <main class="conteudo">
    <header class="topo">
      <label class="visually-hidden" for="pesquisa-manuais">Pesquisar manuais</label>
      <input id="pesquisa-manuais" type="search" placeholder="Pesquisar manuais...">
    </header>

    <section class="titulo-pagina">
      <h1><i class="fa-solid fa-book" aria-hidden="true"></i> Manuais</h1>
      <p>Consulte os procedimentos internos da empresa.</p>
    </section>

    <nav class="categorias" aria-label="Categorias de manuais">
      <button class="categoria ativa" type="button" data-filtro="todos">Todos</button>
      <button class="categoria" type="button" data-filtro="rh">RH</button>
      <button class="categoria" type="button" data-filtro="financeiro">Financeiro</button>
      <button class="categoria" type="button" data-filtro="ti">TI</button>
      <button class="categoria" type="button" data-filtro="operacional">Operacional</button>
    </nav>

    <section id="lista-manuais" class="lista-manuais" aria-label="Lista de manuais"></section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/manuais.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
