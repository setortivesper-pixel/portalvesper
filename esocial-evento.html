<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalhes do Evento eSocial | Portal Vesper</title>
<link rel="stylesheet" href="css/esocial.css">
<link rel="stylesheet" href="css/esocial-evento.css">
</head>
<body>
<!-- Página de detalhes -->
<main class="pagina-esocial pagina-evento">
<section class="card-evento" id="conteudo-evento" aria-live="polite">
<a class="btn-fechar" href="eSocial.html" aria-label="Voltar para Tipos de Arquivo"></a>
<p class="rotulo-evento">Evento eSocial</p>
<span class="codigo codigo-destaque" id="evento-codigo"></span>
<h1 id="evento-titulo"></h1>
<section class="secao-evento" aria-labelledby="titulo-sobre">
<h2 id="titulo-sobre">Sobre este evento</h2>
<p id="evento-descricao"></p>
</section>
<section class="secao-evento" aria-labelledby="titulo-quando-usar">
<h2 id="titulo-quando-usar">Quando usar</h2>
<p id="evento-quando-usar"></p>
</section>
<section class="secao-evento" aria-labelledby="titulo-na-pratica">
<h2 id="titulo-na-pratica">Na prática</h2>
<p id="evento-na-pratica"></p>
</section>
<section class="secao-evento" aria-labelledby="titulo-erros">
<h2 id="titulo-erros">Erros comuns</h2>
<div id="lista-erros"></div>
</section>
</section>
</main>
<script src="js/esocial-evento.js"></script>
</body>
</html>
